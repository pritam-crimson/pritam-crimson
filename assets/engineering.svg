<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="584" viewBox="0 0 1280 584"><defs><linearGradient id="c" x1="0" x2="1" y1="0" y2="1"><stop offset="0" stop-color="#181818"/><stop offset="1" stop-color="#050505"/></linearGradient><style>.m{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace}.s{font-family:-apple-system,"Segoe UI",Helvetica,Arial,sans-serif}</style></defs><rect x="20" y="20" width="610" height="118" rx="14" fill="url(#c)" stroke="#262626"/><rect x="20" y="20" width="4" height="118" rx="2" fill="#d60000"/><text class="m" x="48" y="54" font-size="13" fill="#e00000" letter-spacing="2">01</text><text class="s" x="84" y="56" font-size="21" font-weight="700" fill="#fff">Idempotent diffing</text><text class="m" x="48" y="90" font-size="14" fill="#c4c4c4">Every finding gets a deterministic key, so the same</text><text class="m" x="48" y="114" font-size="14" fill="#c4c4c4">mismatch is never raised twice and stale ones close.</text><rect x="650" y="20" width="610" height="118" rx="14" fill="url(#c)" stroke="#262626"/><rect x="650" y="20" width="4" height="118" rx="2" fill="#d60000"/><text class="m" x="678" y="54" font-size="13" fill="#e00000" letter-spacing="2">02</text><text class="s" x="714" y="56" font-size="21" font-weight="700" fill="#fff">Hash-based change detection</text><text class="m" x="678" y="90" font-size="14" fill="#c4c4c4">Pages are fingerprinted. Unchanged text means no re-read,</text><text class="m" x="678" y="114" font-size="14" fill="#c4c4c4">no AI call, no cost. Only the deltas get processed.</text><rect x="20" y="156" width="610" height="118" rx="14" fill="url(#c)" stroke="#262626"/><rect x="20" y="156" width="4" height="118" rx="2" fill="#d60000"/><text class="m" x="48" y="190" font-size="13" fill="#e00000" letter-spacing="2">03</text><text class="s" x="84" y="192" font-size="21" font-weight="700" fill="#fff">Facts from AI, decisions from rules</text><text class="m" x="48" y="226" font-size="14" fill="#c4c4c4">The model only answers facts. A fixed decision table picks</text><text class="m" x="48" y="250" font-size="14" fill="#c4c4c4">the label, so identical input always gives identical output.</text><rect x="650" y="156" width="610" height="118" rx="14" fill="url(#c)" stroke="#262626"/><rect x="650" y="156" width="4" height="118" rx="2" fill="#d60000"/><text class="m" x="678" y="190" font-size="13" fill="#e00000" letter-spacing="2">04</text><text class="s" x="714" y="192" font-size="21" font-weight="700" fill="#fff">Grounded majority-vote checks</text><text class="m" x="678" y="226" font-size="14" fill="#c4c4c4">A change needs 2 of 3 agreeing reads and a verbatim quote</text><text class="m" x="678" y="250" font-size="14" fill="#c4c4c4">that really exists on the page. No quote, no flag.</text><rect x="20" y="292" width="610" height="118" rx="14" fill="url(#c)" stroke="#262626"/><rect x="20" y="292" width="4" height="118" rx="2" fill="#d60000"/><text class="m" x="48" y="326" font-size="13" fill="#e00000" letter-spacing="2">05</text><text class="s" x="84" y="328" font-size="21" font-weight="700" fill="#fff">Safe writes to production</text><text class="m" x="48" y="362" font-size="14" fill="#c4c4c4">Dry run by default. Confirms the old value is still live,</text><text class="m" x="48" y="386" font-size="14" fill="#c4c4c4">reads back after publishing, saves an undo log per run.</text><rect x="650" y="292" width="610" height="118" rx="14" fill="url(#c)" stroke="#262626"/><rect x="650" y="292" width="4" height="118" rx="2" fill="#d60000"/><text class="m" x="678" y="326" font-size="13" fill="#e00000" letter-spacing="2">06</text><text class="s" x="714" y="328" font-size="21" font-weight="700" fill="#fff">Confidence-tiered routing</text><text class="m" x="678" y="362" font-size="14" fill="#c4c4c4">HIGH confidence auto-applies with a revert switch, LOW goes</text><text class="m" x="678" y="386" font-size="14" fill="#c4c4c4">to a person. Review effort goes where the risk is.</text><rect x="20" y="428" width="610" height="118" rx="14" fill="url(#c)" stroke="#262626"/><rect x="20" y="428" width="4" height="118" rx="2" fill="#d60000"/><text class="m" x="48" y="462" font-size="13" fill="#e00000" letter-spacing="2">07</text><text class="s" x="84" y="464" font-size="21" font-weight="700" fill="#fff">Entity resolution and normalising</text><text class="m" x="48" y="498" font-size="14" fill="#c4c4c4">Records matched on stable IDs, never row position. Dates</text><text class="m" x="48" y="522" font-size="14" fill="#c4c4c4">compared on month and day, labels aligned across systems.</text><rect x="650" y="428" width="610" height="118" rx="14" fill="url(#c)" stroke="#262626"/><rect x="650" y="428" width="4" height="118" rx="2" fill="#d60000"/><text class="m" x="678" y="462" font-size="13" fill="#e00000" letter-spacing="2">08</text><text class="s" x="714" y="464" font-size="21" font-weight="700" fill="#fff">Lifecycle and cost control</text><text class="m" x="678" y="498" font-size="14" fill="#c4c4c4">Resumable per-record checkpoints, staggered re-discovery,</text><text class="m" x="678" y="522" font-size="14" fill="#c4c4c4">tiered archiving, and models chosen by a 103-page benchmark.</text></svg>