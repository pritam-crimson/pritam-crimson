name: update-stats
on:
  schedule:
    - cron: "0 2 * * *"
  workflow_dispatch:
permissions:
  contents: write
jobs:
  update:
    runs-on: ubuntu-latest
    env:
      STATS_TOKEN: ${{ secrets.STATS_TOKEN }}
    steps:
      - name: Skip until the STATS_TOKEN secret exists
        if: env.STATS_TOKEN == ''
        run: echo "STATS_TOKEN secret not set, nothing to do."
      - uses: actions/checkout@v4
        if: env.STATS_TOKEN != ''
      - name: Refresh commit tiles
        if: env.STATS_TOKEN != ''
        run: python3 scripts/update_stats.py
      - name: Commit changes
        if: env.STATS_TOKEN != ''
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if ! git diff --cached --quiet; then
            git commit -m "Update commit stats"
            git push
          fi
